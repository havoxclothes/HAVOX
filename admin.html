<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVOX Admin</title><style>body{font-family:Arial,sans-serif;background:#0b0b0b;color:#fff;margin:0;padding:28px}main{max-width:1000px;margin:auto}h1{font-size:42px;margin:0 0 8px}.muted{color:#aaa}.card{background:#151515;border:1px solid #333;border-radius:18px;padding:20px;margin:16px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}input{background:#0e0e0e;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;flex:1;min-width:180px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.accept{background:#fff;color:#000}.reject{background:#32151a;color:#fff}.status{font-size:12px;letter-spacing:.08em}.request{display:grid;grid-template-columns:1fr auto;gap:16px}.actions{display:flex;gap:8px;align-items:center}.empty{color:#888}.hidden{display:none}.admin-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #333}.tag{font-size:11px;padding:5px 8px;border:1px solid #555;border-radius:999px;color:#bbb}@media(max-width:650px){.request{grid-template-columns:1fr}.actions{justify-content:flex-start}.admin-row{align-items:flex-start;flex-direction:column}}</style></head><body><main><p class="muted">HAVOX / PRIVATE ADMIN</p><h1>ADMIN PANEL</h1><p class="muted">Manage cancellation requests and, as owner, manage co-admin accounts.</p><section class="card" id="loginCard"><h2>Sign in</h2><div class="row"><input id="username" autocomplete="username" placeholder="Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="accept" id="login">SIGN IN</button></div><p id="loginMessage" class="muted"></p></section><section id="panel" class="hidden"><section class="card"><div class="row"><div><b id="who"></b><span id="role" class="tag"></span></div><button id="logout">LOG OUT</button></div></section><section class="card" id="manage"><h2>Co-admins</h2><p class="muted">Only the owner can create or disable co-admin accounts.</p><div class="row"><input id="newUser" placeholder="Co-admin username"><input id="newPass" type="password" placeholder="Temporary password (8+ chars)"><button class="accept" id="create">ADD CO-ADMIN</button></div><p id="adminMessage" class="muted"></p><div id="admins"></div></section><section class="card"><h2>Cancellation Requests</h2><p id="message" class="muted"></p></section><section id="list"></section></section></main><script>let token=sessionStorage.getItem('havoxAdminToken')||'';let current=null;const $=s=>document.querySelector(s);async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(path,{...options,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}function showPanel(user){current=user;$('#loginCard').classList.add('hidden');$('#panel').classList.remove('hidden');$('#who').textContent=user.username+' ';$('#role').textContent=user.role.toUpperCase();$('#manage').classList.toggle('hidden',user.role!=='owner')}async function login(){try{const d=await api('/api/admin',{method:'POST',body:JSON.stringify({action:'login',username:$('#username').value.trim(),password:$('#password').value})});token=d.token;sessionStorage.setItem('havoxAdminToken',token);showPanel(d.user);await loadAll()}catch(e){$('#loginMessage').textContent=e.message}}async function loadAll(){try{const d=await api('/api/admin');current=d.user;showPanel(d.user);$('#admins').innerHTML=d.admins.map(a=>`<div class="admin-row"><div><b>${a.username}</b> <span class="tag">${a.role}</span> ${a.active?'':'<span class="tag">DISABLED</span>'}</div>${current.role==='owner'&&a.role==='admin'&&a.active?`<button class="reject" onclick="disableAdmin(${a.id})">DISABLE</button>`:''}</div>`).join('');const c=await api('/api/cancellations');$('#message').textContent=`${c.requests.length} request(s)`;$('#list').innerHTML=c.requests.length?c.requests.map(x=>`<article class="card request"><div><b>${x.order_number}</b><p>${x.customer_name||'Customer'} · ${x.phone}</p><p>Total: Rs. ${Number(x.total).toLocaleString()}<br>Reason: ${x.reason||'Not provided'}</p><span class="status">${x.status.toUpperCase()}</span></div>${x.status==='requested'?`<div class="actions"><button class="accept" onclick="resolve(${x.id},'accept')">ACCEPT</button><button class="reject" onclick="resolve(${x.id},'reject')">REJECT</button></div>`:''}</article>`).join(''):'<div class="card empty">No cancellation requests.</div>'}catch(e){if(/login required|authorization/i.test(e.message)){logout()}else $('#message').textContent=e.message}}async function resolve(id,action){try{await api('/api/cancellations',{method:'POST',body:JSON.stringify({requestId:id,action})});await loadAll()}catch(e){alert(e.message)}}async function disableAdmin(id){if(!confirm('Disable this co-admin?'))return;try{await api('/api/admin',{method:'POST',body:JSON.stringify({action:'disable',id})});await loadAll()}catch(e){alert(e.message)}}async function createAdmin(){try{await api('/api/admin',{method:'POST',body:JSON.stringify({action:'create',username:$('#newUser').value.trim(),password:$('#newPass').value})});$('#newUser').value='';$('#newPass').value='';$('#adminMessage').textContent='Co-admin created.';await loadAll()}catch(e){$('#adminMessage').textContent=e.message}}function logout(){token='';current=null;sessionStorage.removeItem('havoxAdminToken');$('#panel').classList.add('hidden');$('#loginCard').classList.remove('hidden')}$('#login').onclick=login;$('#create').onclick=createAdmin;$('#logout').onclick=logout;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(token)loadAll();</script></body></html>
