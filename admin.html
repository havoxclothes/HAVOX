<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVOX Admin</title><style>body{font-family:Arial,sans-serif;background:#0b0b0b;color:#fff;margin:0;padding:28px}main{max-width:1000px;margin:auto}h1{font-size:42px;margin:0 0 8px}.muted{color:#aaa}.card{background:#151515;border:1px solid #333;border-radius:18px;padding:20px;margin:16px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}input{background:#0e0e0e;color:#fff;border:1px solid #444;border-radius:10px;padding:12px;flex:1;min-width:220px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.accept{background:#fff;color:#000}.reject{background:#32151a;color:#fff}.status{font-size:12px;letter-spacing:.08em}.request{display:grid;grid-template-columns:1fr auto;gap:16px}.actions{display:flex;gap:8px;align-items:center}.empty{color:#888}@media(max-width:650px){.request{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style></head><body><main><p class="muted">HAVOX / PRIVATE ADMIN</p><h1>CANCELLATION REQUESTS</h1><p class="muted">Review customer requests. Accepting a request cancels the order and releases its reserved stock.</p><section class="card"><div class="row"><input id="key" type="password" placeholder="HAVOX admin key"><button class="accept" id="login">OPEN REQUESTS</button></div><p id="message" class="muted"></p></section><section id="list"></section></main><script>let key=sessionStorage.getItem('havoxAdminKey')||'';const $=s=>document.querySelector(s);$('#key').value=key;$('#login').onclick=()=>{key=$('#key').value.trim();if(!key)return;sessionStorage.setItem('havoxAdminKey',key);load()};async function load(){const r=await fetch('/api/cancellations',{headers:{'x-havox-admin-key':key}});const d=await r.json();if(!r.ok){$('#message').textContent=d.error||'Unable to load requests';return}$('#message').textContent=`${d.requests.length} request(s)`;$('#list').innerHTML=d.requests.length?d.requests.map(x=>`<article class="card request"><div><b>${x.order_number}</b><p>${x.customer_name||'Customer'} · ${x.phone}</p><p>Total: Rs. ${Number(x.total).toLocaleString()}<br>Reason: ${x.reason||'Not provided'}</p><span class="status">${x.status.toUpperCase()}</span></div>${x.status==='requested'?`<div class="actions"><button class="accept" onclick="resolve(${x.id},'accept')">ACCEPT</button><button class="reject" onclick="resolve(${x.id},'reject')">REJECT</button></div>`:''}</article>`).join(''):'<div class="card empty">No cancellation requests.</div>'}async function resolve(id,action){const r=await fetch('/api/cancellations',{method:'POST',headers:{'Content-Type':'application/json','x-havox-admin-key':key},body:JSON.stringify({requestId:id,action})});const d=await r.json();if(!r.ok){alert(d.error||'Action failed');return}await load()}if(key)load();</script></body></html>
